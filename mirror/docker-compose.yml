services:
  postgres:
    image: postgres:16-alpine
    container_name: opensubtitles-mirror-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
      POSTGRES_DB: opensubtitles_mirror
    volumes:
      - mirror_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mirror -d opensubtitles_mirror']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ${MIRROR_IMAGE:-opensubtitles-mirror:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensubtitles-mirror-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://mirror:mirror@postgres:5432/opensubtitles_mirror
      OPENSUBTITLES_SCRAPER_URL: ${OPENSUBTITLES_SCRAPER_URL:-http://host.docker.internal:8000}
      WORKER_RATE_PER_SECOND: ${WORKER_RATE_PER_SECOND:-2}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_ANUBIS_COOLDOWN_SECONDS: ${WORKER_ANUBIS_COOLDOWN_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['worker']
    profiles:
      - worker

  adminer:
    image: adminer:4
    container_name: opensubtitles-mirror-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8088}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mirror_pg_data:
