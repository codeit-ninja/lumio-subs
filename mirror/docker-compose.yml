services:
  postgres:
    image: postgres:16-alpine
    container_name: opensubtitles-mirror-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
      POSTGRES_DB: opensubtitles_mirror
    volumes:
      - mirror_pg_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mirror -d opensubtitles_mirror']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: oven/bun:1.2-alpine
    container_name: opensubtitles-mirror-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://mirror:mirror@postgres:5432/opensubtitles_mirror
      OPENSUBTITLES_SCRAPER_URL: ${OPENSUBTITLES_SCRAPER_URL:-http://host.docker.internal:8000}
      WORKER_RATE_PER_SECOND: ${WORKER_RATE_PER_SECOND:-10}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['bun', 'run', 'src/jobs/download-worker.ts']
    profiles:
      - worker

volumes:
  mirror_pg_data:
