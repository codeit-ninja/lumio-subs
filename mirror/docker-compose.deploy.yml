# Production / Dockhand stack — mirror + LavX scraper on one network.
#
# Required env:
#   MIRROR_IMAGE=ghcr.io/<owner>/opensubtitles-mirror:latest
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET
#   R2_PUBLIC_BASE_URL=https://pub-xxxx.r2.dev
#   METADATA_DUMP_URL=https://dl.opensubtitles.org/addons/export/subtitles_month.txt.gz
#
# Private GHCR: docker login ghcr.io -u USER -p PAT (read:packages)

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8191/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  opensubtitles-scraper:
    image: ghcr.io/lavx/opensubtitles-scraper:latest
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      # Stay under Anubis soft-ban (datacenter IPs get blocked fast at ~10/s)
      - SCRAPER_MIN_REQUEST_INTERVAL=0.5
      - SCRAPER_RATE_LIMIT_PER_MINUTE=120
      - SCRAPER_MAX_CONCURRENT_REQUESTS=1
      - SCRAPER_MAX_INFLIGHT_REQUESTS=2
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirror}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirror}
      POSTGRES_DB: ${POSTGRES_DB:-opensubtitles_mirror}
    volumes:
      - mirror_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  importer:
    image: ${MIRROR_IMAGE:-ghcr.io/OWNER/opensubtitles-mirror:latest}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mirror}:${POSTGRES_PASSWORD:-mirror}@postgres:5432/${POSTGRES_DB:-opensubtitles_mirror}
      METADATA_DUMP_URL: ${METADATA_DUMP_URL:-https://dl.opensubtitles.org/addons/export/subtitles_all.txt.gz}
      METADATA_DUMP_PATH: ${METADATA_DUMP_PATH:-/data/subtitles_all.txt.gz}
      METADATA_DUMP_FORCE_DOWNLOAD: ${METADATA_DUMP_FORCE_DOWNLOAD:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - mirror_data:/data
    command: ['import-metadata']

  worker:
    image: ${MIRROR_IMAGE:-ghcr.io/OWNER/opensubtitles-mirror:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensubtitles-scraper:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mirror}:${POSTGRES_PASSWORD:-mirror}@postgres:5432/${POSTGRES_DB:-opensubtitles_mirror}
      # Same compose network — do NOT use localhost / host.docker.internal here
      OPENSUBTITLES_SCRAPER_URL: ${OPENSUBTITLES_SCRAPER_URL:-http://opensubtitles-scraper:8000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-opensubtitles-mirror}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      # Keep low — OpenSubtitles Anubis soft-bans datacenter IPs at ~10/s
      WORKER_RATE_PER_SECOND: ${WORKER_RATE_PER_SECOND:-2}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_ANUBIS_COOLDOWN_SECONDS: ${WORKER_ANUBIS_COOLDOWN_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ['worker']

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8088}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mirror_pg_data:
  mirror_data:
