# Production stack — app + PocketBase + LavX OpenSubtitles scraper.
#
# Required env:
#   APP_IMAGE=ghcr.io/<owner>/lumio-subs:latest
#   POCKETBASE_IMAGE=ghcr.io/<owner>/lumio-subs-pocketbase:latest
#   TMDB_API_KEY / PB_ADMIN_EMAIL / PB_ADMIN_PASSWORD
#   ORIGIN=https://subs.example.com   (public URL of the app)
#
# Optional:
#   SUBDL_API_KEY
#   APP_PORT (default 3000)
#   PB_PORT (default 8093) — PocketBase admin UI
#
# Private GHCR: docker login ghcr.io -u USER -p PAT (read:packages)

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/OWNER/lumio-subs:latest}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Server-side PocketBase (Docker DNS). Not required in the browser.
      PUBLIC_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL:-http://pocketbase:8090}
      OPENSUBTITLES_SCRAPER_URL: ${OPENSUBTITLES_SCRAPER_URL:-http://opensubtitles-scraper:8000}
      TMDB_API_KEY: ${TMDB_API_KEY}
      SUBDL_API_KEY: ${SUBDL_API_KEY:-}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      ORIGIN: ${ORIGIN:-}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-x-forwarded-proto}
      HOST_HEADER: ${HOST_HEADER:-x-forwarded-host}
    depends_on:
      pocketbase:
        condition: service_healthy
      opensubtitles-scraper:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'fetch("http://127.0.0.1:3000/api/status").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pocketbase:
    image: ${POCKETBASE_IMAGE:-ghcr.io/OWNER/lumio-subs-pocketbase:latest}
    restart: unless-stopped
    ports:
      - '${PB_PORT:-8093}:8090'
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - pb_data:/pb_data
    command:
      - --migrationsDir=/pb_migrations
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8191/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  opensubtitles-scraper:
    image: ghcr.io/lavx/opensubtitles-scraper:latest
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - SCRAPER_MIN_REQUEST_INTERVAL=0.1
      - SCRAPER_RATE_LIMIT_PER_MINUTE=600
      - SCRAPER_MAX_CONCURRENT_REQUESTS=10
      - SCRAPER_MAX_INFLIGHT_REQUESTS=20
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  pb_data:
